name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
      
      - name: Create Flutter project
        run: flutter create --org com.polchi --project-name pol_chi --platforms=android temp_project
      
      - name: Copy code
        run: |
          cp lib/main.dart temp_project/lib/main.dart
          cp pubspec.yaml temp_project/pubspec.yaml
          mkdir -p temp_project/assets/images
          mkdir -p temp_project/assets/images/characters
          cp -r assets/images/* temp_project/assets/images/ 2>/dev/null || true
      
      - name: Get dependencies
        working-directory: temp_project
        run: flutter pub get
      
      - name: Build APK
        working-directory: temp_project
        run: flutter build apk --release
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pol-chi-apk
          path: temp_project/build/app/outputs/flutter-apk/app-release.apk